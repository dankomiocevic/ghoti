name: Release

# Pushing a v* tag builds the release with GoReleaser (see .goreleaser.yaml)
# and uploads it as a draft, together with checksums, SBOMs, a Sigstore
# signature and build provenance attestations. The draft has to be published
# by hand from the GitHub releases page once the notes and assets look right.
#
# The release body comes from the CHANGELOG.md section of the version, the
# workflow fails when there is none.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/pull_request.yaml
    secrets: inherit

  release:
    name: Build and Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload the assets
      id-token: write      # Sigstore keyless signing and attestations
      attestations: write  # store the build provenance attestations
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history and the tags to work out the
          # version and the previous release.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          cache-dependency-path: './go.sum'
          check-latest: true

      - name: Check for known vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: './go.mod'
          go-package: ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Extract release notes
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Build and publish draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes "${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The attestation is stored in the repository's attestation store and
      # linked to the digest of each file, it is not a release asset. Verify it
      # with `gh attestation verify <file> --repo dankomiocevic/ghoti`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
